<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --bg1: #0d1b2a;
        --bg2: #102a43;
        --panel: rgba(255,255,255,0.95);
        --panel-soft: rgba(255,255,255,0.88);
        --ink: #17324d;
        --muted: #5c6f82;
        --green: #0e784a;
        --green-2: #15a362;
        --gold: #f2c14e;
        --red: #c0392b;
        --blue: #2d7ff9;
        --path: #ff5b5b;
        --arrow: #1f7ae0;
        --line: #d5deea;
        --shadow: 0 16px 40px rgba(4, 27, 44, 0.22);
        --radius: 22px;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(21,163,98,0.24), transparent 30%),
          radial-gradient(circle at top right, rgba(242,193,78,0.20), transparent 26%),
          linear-gradient(135deg, var(--bg1), var(--bg2));
        min-height: 100vh;
      }

      #app {
        width: 100%;
        min-height: 100vh;
        padding: 22px;
      }

      .screen {
        max-width: 1180px;
        margin: 0 auto;
      }

      .card {
        background: var(--panel);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 24px;
      }

      .card + .card {
        margin-top: 18px;
      }

      .splash {
        min-height: calc(100vh - 44px);
        display: grid;
        place-items: center;
      }

      .splash-panel {
        max-width: 980px;
        width: 100%;
        padding: 36px;
        display: grid;
        grid-template-columns: minmax(260px, 340px) 1fr;
        gap: 28px;
        align-items: center;
      }

      .title-block h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 5vw, 3.4rem);
        line-height: 1.04;
      }

      .title-block p {
        font-size: 1.08rem;
        line-height: 1.6;
        color: var(--muted);
        margin: 0 0 18px;
      }

      .hero-badge-wrap {
        display: grid;
        place-items: center;
      }

      .hero-badge {
        width: min(320px, 60vw);
        aspect-ratio: 1 / 1;
        border-radius: 50%;
        background: linear-gradient(160deg, #ffffff, #eaf4ef);
        border: 12px solid var(--green);
        box-shadow: 0 16px 34px rgba(0,0,0,0.18), inset 0 0 0 5px rgba(255,255,255,0.65);
        padding: 18px;
      }

      .hero-badge img,
      .small-mascot img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        display: block;
      }

      .button-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      button,
      .button-like {
        border: none;
        border-radius: 999px;
        padding: 13px 20px;
        font-weight: 700;
        font-size: 0.98rem;
        cursor: pointer;
        transition: transform 0.15s ease, filter 0.15s ease, opacity 0.15s ease;
      }

      button:hover,
      .button-like:hover {
        transform: translateY(-1px);
        filter: brightness(1.02);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
        transform: none;
        filter: none;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--green), var(--green-2));
        color: #fff;
      }

      .btn-secondary {
        background: #e8eef6;
        color: var(--ink);
      }

      .btn-warning {
        background: linear-gradient(135deg, #ffcf66, #f2a93b);
        color: #4b3300;
      }

      .btn-danger {
        background: #fbe7e5;
        color: var(--red);
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        color: #fff;
      }

      .topbar h2 {
        margin: 0;
        font-size: 1.35rem;
      }

      .score-pill-wrap {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .score-pill {
        background: rgba(255,255,255,0.14);
        color: #fff;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 999px;
        padding: 8px 14px;
        font-weight: 700;
      }

      .small-mascot {
        width: 70px;
        height: 70px;
        padding: 4px;
        border-radius: 50%;
        background: linear-gradient(160deg, #fff, #eaf4ef);
        border: 4px solid var(--green);
        box-shadow: 0 10px 24px rgba(0,0,0,0.18);
      }

      .split {
        display: grid;
        grid-template-columns: 1.35fr 0.95fr;
        gap: 18px;
      }

      .split.equal {
        grid-template-columns: 1fr 1fr;
      }

      .panel-title {
        margin: 0 0 10px;
        font-size: 1.3rem;
      }

      .subtle {
        color: var(--muted);
        line-height: 1.55;
      }

      .map-host {
        width: 100%;
      }

      .map-shell {
        position: relative;
        width: 100%;
        border-radius: 22px;
        overflow: hidden;
        background: linear-gradient(180deg, #f7fafc, #e9f1f7);
        border: 2px solid #d6e1eb;
      }

      .map-shell svg {
        display: block;
        width: 100%;
        height: 100%;
      }

      .map-caption {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .map-target {
        position: absolute;
        transform: translate(-50%, -50%);
        min-width: 110px;
        min-height: 48px;
        border-radius: 16px;
        border: 2px dashed #7b93a9;
        background: rgba(255,255,255,0.9);
        color: var(--ink);
        font-weight: 700;
        padding: 6px 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        line-height: 1.15;
        box-shadow: 0 8px 18px rgba(12, 43, 73, 0.12);
      }

      .map-target.interactive {
        cursor: pointer;
      }

      .map-target.interactive:hover {
        border-color: var(--blue);
      }

      .map-target.assigned {
        border-style: solid;
        border-color: var(--green);
      }

      .map-target.correct {
        background: #e4f6ed;
        border-color: var(--green);
        color: #0a5c37;
      }

      .map-target.incorrect {
        background: #fde9e7;
        border-color: var(--red);
        color: #8e241a;
      }

      .prompt-box {
        background: #f5f8fb;
        border: 1px solid #dde7f0;
        border-radius: 18px;
        padding: 16px;
      }

      .prompt-box h3 {
        margin: 0 0 8px;
      }

      .answer-stack {
        display: grid;
        gap: 12px;
        margin-top: 14px;
      }

      .answer-row {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 10px;
        align-items: center;
      }

      .answer-row label {
        font-weight: 700;
      }

      input[type="number"],
      input[type="text"] {
        width: 100%;
        border-radius: 14px;
        border: 2px solid #cad6e2;
        padding: 12px 14px;
        font-size: 1rem;
        background: #fff;
      }

      input[type="number"]:focus,
      input[type="text"]:focus {
        outline: none;
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(45,127,249,0.12);
      }


      select {
        width: 100%;
        border-radius: 14px;
        border: 2px solid #cad6e2;
        padding: 12px 14px;
        font-size: 1rem;
        background: #fff;
      }

      select:focus {
        outline: none;
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(45,127,249,0.12);
      }


      textarea {
        width: 100%;
        border-radius: 14px;
        border: 2px solid #cad6e2;
        padding: 12px 14px;
        font-size: 1rem;
        background: #fff;
        min-height: 110px;
        resize: vertical;
      }

      textarea:focus {
        outline: none;
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(45,127,249,0.12);
      }

      .identity-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 18px 0;
      }

      .status-banner {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 14px;
        font-weight: 700;
      }

      .status-banner.good {
        background: #e6f7ee;
        color: #0a5c37;
        border: 1px solid #b7e7ca;
      }

      .status-banner.bad {
        background: #fdebea;
        color: #8e241a;
        border: 1px solid #f3c1bd;
      }

      .status-banner.info {
        background: #eef5ff;
        color: #1d4f91;
        border: 1px solid #cddff9;
      }

      .mc-option {
        display: block;
        padding: 12px 14px;
        border-radius: 14px;
        border: 2px solid #d9e3ec;
        background: #fff;
        margin-top: 8px;
        cursor: pointer;
      }

      .mc-option input {
        margin-right: 10px;
      }

      .summary-metric-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .metric-card {
        background: #f7fbff;
        border: 1px solid #dde7f0;
        border-radius: 18px;
        padding: 16px;
      }

      .metric-card h4 {
        margin: 0 0 6px;
        font-size: 0.95rem;
      }

      .metric-card .metric-value {
        font-size: 1.6rem;
        font-weight: 800;
      }

      .concept-marker {
        position: absolute;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 5;
        pointer-events: none;
      }

      .concept-badge {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #17324d;
        color: #fff;
        font-weight: 800;
        box-shadow: 0 6px 14px rgba(12, 43, 73, 0.16);
        border: 3px solid #fff;
      }

      .concept-marker.with-label .concept-label {
        background: rgba(255,255,255,0.96);
        color: var(--ink);
        border: 1px solid #d5e0ea;
        border-radius: 999px;
        padding: 6px 10px;
        font-weight: 700;
        white-space: nowrap;
        box-shadow: 0 8px 18px rgba(12, 43, 73, 0.12);
      }

      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 18px;
      }

      .label-chip-wrap {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 14px 0 4px;
      }

      .label-chip {
        padding: 11px 16px;
        border-radius: 999px;
        background: #edf3f9;
        border: 2px solid #d5e0ea;
        font-weight: 700;
        color: var(--ink);
        cursor: pointer;
        user-select: none;
      }

      .label-chip:hover {
        border-color: var(--blue);
      }

      .label-chip.selected {
        background: #dcebff;
        border-color: var(--blue);
        color: #0f4da5;
      }

      .label-chip.used {
        opacity: 0.55;
      }

      .helper-note {
        color: var(--muted);
        font-size: 0.95rem;
        margin-top: 6px;
      }

      .feedback-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.9fr;
        gap: 18px;
      }

      .result-banner {
        border-radius: 18px;
        padding: 16px;
        font-weight: 700;
        font-size: 1.05rem;
      }

      .result-banner.good {
        background: #e7f7ee;
        color: #0f623b;
        border: 1px solid #bfe9d0;
      }

      .result-banner.bad {
        background: #fff0ef;
        color: #8c2d1f;
        border: 1px solid #f4c4bf;
      }

      .check-list {
        list-style: none;
        padding: 0;
        margin: 14px 0 0;
        display: grid;
        gap: 10px;
      }

      .check-list li {
        background: #f7fafc;
        border: 1px solid #d9e5ef;
        border-radius: 16px;
        padding: 12px 14px;
      }

      .check-list strong {
        display: block;
        margin-bottom: 3px;
      }

      .check-good {
        color: #0b7f49;
      }

      .check-bad {
        color: #a63325;
      }

      .compare-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .route-card {
        background: #f8fbfd;
        border: 1px solid #dbe6ef;
        border-radius: 20px;
        padding: 14px;
      }

      .route-card h3 {
        margin: 0 0 10px;
      }

      fieldset {
        border: 1px solid #d9e5ef;
        border-radius: 16px;
        padding: 14px;
        margin: 0 0 12px;
      }

      legend {
        font-weight: 700;
        padding: 0 8px;
      }

      .option-stack {
        display: grid;
        gap: 10px;
      }

      .radio-row {
        display: flex;
        gap: 10px;
        align-items: center;
        background: #f7fafc;
        border-radius: 14px;
        padding: 10px 12px;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
      }

      .summary-card {
        background: #f7fafc;
        border: 1px solid #d8e4ee;
        border-radius: 18px;
        padding: 16px;
      }

      .summary-card h3 {
        margin: 0 0 8px;
      }

      .big-score {
        font-size: clamp(2.2rem, 6vw, 3.8rem);
        font-weight: 800;
        line-height: 1;
        margin: 8px 0 0;
      }

      .review-panel {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #d8e4ee;
      }

      .review-item {
        border: 1px solid #dde8f0;
        border-radius: 16px;
        padding: 14px;
        background: #f9fbfd;
      }

      .review-item + .review-item {
        margin-top: 10px;
      }

      .callout {
        background: #eef7ff;
        border-left: 5px solid var(--blue);
        padding: 14px 16px;
        border-radius: 14px;
        color: #21496c;
      }

      .pill {
        display: inline-block;
        padding: 7px 12px;
        border-radius: 999px;
        background: #edf5ff;
        color: #20496e;
        font-weight: 700;
        font-size: 0.92rem;
      }

      .legend-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 12px 0 0;
      }

      .legend-chip {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        background: #f7fafc;
        border: 1px solid #dde6ef;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.92rem;
      }

      .legend-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: inline-block;
      }

      .route-note {
        font-size: 0.95rem;
        color: var(--muted);
        margin-top: 8px;
      }


      .hint-banner {
        margin-top: 10px;
        display: inline-block;
        padding: 10px 14px;
        border-radius: 14px;
        background: #fff5d8;
        border: 2px solid #f2c14e;
        color: #6c4f00;
        font-weight: 800;
      }

      .compare-focus-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      .compare-grid.focus-a,
      .compare-grid.focus-b {
        grid-template-columns: 1fr;
      }

      .compare-grid.focus-a .route-card.route-b,
      .compare-grid.focus-b .route-card.route-a {
        display: none;
      }

      .compare-grid.focus-a .route-card.route-a .map-shell,
      .compare-grid.focus-b .route-card.route-b .map-shell {
        min-height: 540px;
      }

      @media (max-width: 980px) {
        .split,
        .feedback-grid,
        .summary-grid {
          grid-template-columns: 1fr;
        }

        .splash-panel {
          grid-template-columns: 1fr;
          text-align: center;
        }

        .button-row {
          justify-content: center;
        }

        .compare-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 640px) {
        #app {
          padding: 14px;
        }

        .card {
          padding: 18px;
        }

        .answer-row {
          grid-template-columns: 1fr;
        }


        .identity-grid,
        .summary-metric-grid {
          grid-template-columns: 1fr;
        }

        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }

        .map-target {
          min-width: 86px;
          min-height: 42px;
          font-size: 0.86rem;
        }
      }

      :root {
        --lab-bg: #051622;
        --lab-bg-2: #0b2a3a;
        --lab-panel: #0c3540;
        --lab-panel-dark: #061d2b;
        --parchment: #efe0bf;
        --parchment-2: #f7ecd5;
        --parchment-3: #dfc49a;
        --ink: #10233b;
        --ink-soft: #4e5a63;
        --brass: #b88935;
        --brass-light: #e1bf70;
        --teal: #0d5863;
        --teal-dark: #073943;
        --green: #087d4f;
        --green-dark: #055e3c;
        --red-path: #d8342a;
        --blue-displacement: #1268c4;
        --paper-line: rgba(78, 54, 23, 0.10);
        --panel-border: rgba(73, 48, 19, 0.42);
        --shadow-deep: 0 20px 46px rgba(0,0,0,0.38);
        --shadow-soft: 0 8px 20px rgba(40, 25, 10, 0.18);
      }

      body {
        color: var(--ink);
        background:
          radial-gradient(circle at 10% 15%, rgba(13, 88, 99, 0.38), transparent 24%),
          radial-gradient(circle at 88% 18%, rgba(184, 137, 53, 0.18), transparent 20%),
          linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)),
          linear-gradient(135deg, var(--lab-bg), var(--lab-bg-2) 45%, #102a39);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 34px 34px;
        opacity: 0.18;
      }

      #app {
        position: relative;
        padding: 18px 20px 28px;
      }

      .screen {
        max-width: 1620px;
      }

      .card,
      .prompt-box,
      .route-card,
      .summary-card,
      .metric-card,
      .check-list li,
      fieldset,
      .review-item {
        border-radius: 14px;
        background:
          linear-gradient(var(--paper-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--paper-line) 1px, transparent 1px),
          linear-gradient(180deg, var(--parchment-2), var(--parchment));
        background-size: 22px 22px, 22px 22px, auto;
        border: 2px solid var(--panel-border);
        box-shadow: var(--shadow-soft), inset 0 0 0 1px rgba(255,255,255,0.36);
      }

      button,
      .button-like {
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: 0.01em;
        min-height: 52px;
        box-shadow: 0 5px 0 rgba(39, 27, 12, 0.22);
      }

      .btn-primary {
        background: linear-gradient(180deg, #0b8d58, #066c43);
        color: #fff;
        border: 2px solid rgba(6, 84, 54, 0.8);
      }

      .btn-secondary {
        background: linear-gradient(180deg, #f7f7f3, #e5e2d9);
        color: var(--ink);
        border: 2px solid rgba(25, 54, 72, 0.25);
      }

      .btn-warning {
        background: linear-gradient(180deg, #edc57b, #cf9940);
        color: #3f2400;
        border: 2px solid rgba(113, 70, 14, 0.6);
      }

      .lab-screen {
        position: relative;
      }

      .lab-topbar {
        position: relative;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
        margin-bottom: 18px;
        padding: 10px 14px 10px 18px;
        border-radius: 16px;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0)),
          linear-gradient(135deg, var(--lab-panel), var(--lab-panel-dark));
        border: 2px solid rgba(184, 137, 53, 0.55);
        box-shadow: var(--shadow-deep);
        overflow: hidden;
      }

      .lab-topbar::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: linear-gradient(90deg, transparent, var(--brass-light), transparent);
        opacity: 0.9;
      }

      .lab-topbar-main {
        display: flex;
        align-items: center;
        gap: 18px;
        min-width: 0;
      }

      .lab-emblem {
        width: 90px;
        height: 90px;
        flex: 0 0 90px;
        border-radius: 50%;
        padding: 6px;
        background:
          radial-gradient(circle at center, #0a2a34 0 58%, transparent 59%),
          conic-gradient(from 0deg, var(--brass-light), #805d25, var(--brass-light), #805d25, var(--brass-light));
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18), 0 12px 24px rgba(0,0,0,0.28);
        position: relative;
      }

      .lab-emblem::before {
        content: "☠";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: rgba(255,244,221,0.85);
        font-size: 1.8rem;
        z-index: 0;
      }

      .lab-emblem img {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid rgba(255,246,223,0.8);
      }

      .lab-title-wrap {
        min-width: 0;
      }

        background: linear-gradient(180deg, rgba(13,89,98,0.14), rgba(13,89,98,0.08));
        color: var(--teal-dark);
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-size: 0.82rem;
      }

      .title-identity-grid {
        gap: 16px;
      }

      .title-button-row {
        margin-bottom: 20px;
      }

      .title-support-grid {
        margin-top: 0;
        margin-bottom: 20px;
      }

      .title-legend-row {
        justify-content: flex-start;
      }

      .title-ruler {
        position: absolute;
        left: 110px;
        right: 110px;
        bottom: 22px;
        height: 56px;
        display: flex;
        align-items: flex-end;
        justify-content: space-evenly;
        gap: 6px;
        padding-bottom: 7px;
        border: 2px solid rgba(103, 63, 15, 0.8);
        border-radius: 6px;
        background:
          repeating-linear-gradient(90deg, transparent 0 44px, rgba(76, 46, 7, 0.26) 44px 46px),
          linear-gradient(180deg, #c89542, #a26f23);
        box-shadow: 0 8px 18px rgba(0,0,0,0.2);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1rem;
        color: #412400;
      }

      .title-prop-left,
      .title-prop-right {
        position: absolute;
        top: 70px;
        bottom: 86px;
        width: 132px;
        pointer-events: none;
        z-index: 0;
      }

      .title-prop-left {
        left: -8px;
      }

      .title-prop-right {
        right: -4px;
      }

      .title-formula {
        position: absolute;
        left: 10px;
        top: 40px;
        color: rgba(242, 237, 214, 0.48);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 2.3rem;
        transform: rotate(-9deg);
      }

      .title-glass-column,
      .title-flask,
      .title-compass-sketch,
      .title-lantern,
      .title-blueprint,
      .title-telescope {
        position: absolute;
      }

      .title-glass-column {
        left: 18px;
        top: 96px;
        width: 62px;
        height: 240px;
        border-radius: 30px 30px 18px 18px;
        border: 3px solid rgba(217, 190, 132, 0.58);
        background:
          linear-gradient(180deg, transparent 0 55%, rgba(43, 187, 196, 0.38) 55% 100%),
          linear-gradient(90deg, rgba(255,255,255,0.18), transparent 32%);
      }

      .title-flask {
        border: 3px solid rgba(217, 190, 132, 0.55);
        background:
          linear-gradient(180deg, transparent 0 50%, rgba(43, 187, 196, 0.48) 50% 100%),
          linear-gradient(90deg, rgba(255,255,255,0.16), transparent 30%);
      }

      .title-flask-large {
        left: 0;
        bottom: 6px;
        width: 78px;
        height: 102px;
        border-radius: 22px 22px 28px 28px;
      }

      .title-flask-small {
        left: 62px;
        bottom: 36px;
        width: 46px;
        height: 64px;
        border-radius: 18px 18px 22px 22px;
      }

      .title-compass-sketch {
        left: 24px;
        top: 354px;
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 2px solid rgba(233, 228, 205, 0.24);
      }

      .title-compass-sketch::before,
      .title-compass-sketch::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        background: rgba(233, 228, 205, 0.24);
        transform: translate(-50%, -50%);
      }

      .title-compass-sketch::before {
        width: 2px;
        height: 72%;
      }

      .title-compass-sketch::after {
        width: 72%;
        height: 2px;
      }

      .title-lantern {
        right: 22px;
        top: 78px;
        width: 84px;
        height: 166px;
        border-radius: 20px;
        border: 3px solid rgba(142, 102, 35, 0.8);
        background:
          radial-gradient(circle at center, rgba(255,220,144,0.9), rgba(255,176,64,0.38) 38%, transparent 68%),
          linear-gradient(180deg, rgba(43,32,20,0.86), rgba(110,78,28,0.5), rgba(43,32,20,0.86));
        box-shadow: 0 0 32px rgba(255, 190, 95, 0.3);
      }

      .title-blueprint {
        right: 12px;
        top: 278px;
        width: 92px;
        height: 120px;
        border-radius: 8px;
        border: 2px solid rgba(111, 78, 30, 0.56);
        background:
          linear-gradient(rgba(87, 62, 30, 0.08) 1px, transparent 1px),
          linear-gradient(90deg, rgba(87, 62, 30, 0.08) 1px, transparent 1px),
          linear-gradient(180deg, rgba(245, 230, 188, 0.95), rgba(225, 202, 152, 0.95));
        background-size: 12px 12px, 12px 12px, auto;
        transform: rotate(5deg);
      }

      .title-telescope {
        right: 0;
        bottom: 24px;
        width: 124px;
        height: 30px;
        border-radius: 999px;
        background: linear-gradient(90deg, #75521d, #c39547, #7a5722);
        transform: rotate(-31deg);
        box-shadow: 0 6px 14px rgba(0,0,0,0.25);
      }

      .mission-card {
        padding: 32px 34px;
        min-height: 176px;
      }

      .mission-card .panel-title {
        margin: 0 0 10px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.1rem, 3vw, 3.2rem);
        color: #152842;
      }

      .mission-card .subtle {
        font-size: 1.15rem;
        color: #3e4f5b;
      }

      .mission-watermark {
        right: 126px;
        width: 200px;
        height: 200px;
        opacity: 0.26;
      }

      .activity-panel {
        padding: 28px 24px 24px;
        gap: 22px;
      }

      .route-side {
        position: relative;
      }

      .map-frame {
        position: relative;
        padding: 16px;
        border-radius: 16px;
        background:
          linear-gradient(180deg, rgba(255,255,255,0.34), rgba(255,255,255,0.08)),
          linear-gradient(180deg, #f7ecd4, #edd8b2);
        border: 2px solid rgba(73, 48, 19, 0.28);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.45);
      }

      .map-frame-inner {
        position: relative;
        padding: 18px 20px 12px;
        border-radius: 10px;
        background:
          linear-gradient(rgba(20, 49, 65, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20, 49, 65, 0.05) 1px, transparent 1px),
          #f6ead2;
        background-size: 28px 28px, 28px 28px, auto;
        border: 2px solid rgba(31, 74, 86, 0.18);
        overflow: hidden;
      }

      .map-rose {
        position: absolute;
        right: 18px;
        top: 12px;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        opacity: 0.18;
        border: 2px solid rgba(114, 88, 42, 0.4);
      }

      .map-rose::before,
      .map-rose::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        background: rgba(114, 88, 42, 0.4);
        transform: translate(-50%, -50%);
      }

      .map-rose::before {
        width: 2px;
        height: 80%;
      }

      .map-rose::after {
        width: 80%;
        height: 2px;
      }

      .route-side .map-host {
        position: relative;
        z-index: 1;
      }

      .route-side .map-shell {
        min-height: 292px;
        border: 0;
        background: transparent;
        box-shadow: none;
      }

      .map-meter-label {
        margin-top: 10px;
        text-align: center;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 1rem;
        color: #4a3314;
      }

      .measurement-panel {
        position: relative;
      }

      .measurement-panel::after {
        content: "";
        position: absolute;
        right: 16px;
        bottom: 16px;
        width: 96px;
        height: 96px;
        opacity: 0.1;
        border-radius: 12px;
        background:
          linear-gradient(135deg, transparent 42%, rgba(89,62,31,0.5) 42% 46%, transparent 46%),
          linear-gradient(180deg, rgba(89,62,31,0.16), transparent);
      }

      .measurement-header {
        font-size: 1.55rem;
        color: #182d46;
      }

      .answer-row + .answer-row {
        margin-top: 18px;
      }

      .measurement-label-row {
        margin-bottom: 9px;
      }

      .measurement-label-row label {
        font-weight: 800;
        font-size: 1.05rem;
        color: #1a2d45;
      }

      .measurement-input-wrap {
        background: rgba(255,255,255,0.76);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.55);
      }

      .measurement-input-wrap input {
        min-height: 56px;
      }

      .helper-note {
        margin-top: 10px;
      }

      .lab-action-row {
        margin-top: 20px;
      }

      .support-card {
        min-height: 194px;
        padding: 20px 18px 18px;
      }

      .support-card::after {
        opacity: 0.16;
        font-size: 4rem;
      }

      .support-card-title {
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #1b2e44;
      }

      .hint-banner {
        background: linear-gradient(180deg, #fff6d8, #f2dd9a);
        border-color: rgba(184, 137, 53, 0.86);
        color: #6a4800;
      }

      .radio-row,
      .mc-option {
        background: rgba(255,255,255,0.48);
        border-color: rgba(31, 74, 86, 0.18);
      }

      .route-card {
        padding: 16px;
      }

      .route-card h3 {
        font-family: Georgia, "Times New Roman", serif;
      }

      .result-banner.good {
        background: linear-gradient(180deg, rgba(230,247,238,0.95), rgba(194,233,208,0.9));
      }

      .result-banner.bad {
        background: linear-gradient(180deg, rgba(255,240,239,0.95), rgba(247,210,203,0.9));
      }

      @media (max-width: 1100px) {
        .title-prop-left,
        .title-prop-right,
        .lab-prop-left,
        .lab-prop-right,
        .lab-ruler-footer,
        .title-ruler {
          opacity: 0.25;
        }

        .activity-grid,
        .support-grid,
        .activity-panel,
        .compare-activity-panel {
          grid-template-columns: 1fr;
        }

        .title-panel {
          grid-template-columns: 1fr;
          text-align: center;
        }

        .title-button-row,
        .title-legend-row {
          justify-content: center;
        }
      }

      @media (max-width: 900px) {
        .lab-topbar {
          grid-template-columns: 1fr;
        }

        .lab-status-row {
          justify-content: flex-start;
        }

        .mission-card {
          grid-template-columns: 1fr;
        }

        .title-prop-left,
        .title-prop-right,
        .mission-watermark,
        .lab-prop-left,
        .lab-prop-right {
          display: none;
        }

        .title-stage {
          padding-inline: 16px;
          padding-bottom: 82px;
        }

        .title-ruler {
          left: 24px;
          right: 24px;
        }
      }

      @media (max-width: 640px) {
        .lab-stage {
          padding: 16px 14px 72px;
        }

        .lab-topbar-main {
          align-items: flex-start;
        }

        .lab-emblem {
          width: 74px;
          height: 74px;
          flex-basis: 74px;
        }

        .mission-mascot {
          display: none;
        }

        .title-panel {
          padding: 24px 20px 26px;
        }

        .title-copy-block h1 {
          font-size: clamp(2.2rem, 10vw, 3rem);
        }

        .title-ruler {
          height: 48px;
          font-size: 0.82rem;
          left: 14px;
          right: 14px;
        }

        .lab-action-row,
        .controls {
          grid-template-columns: 1fr;
          flex-direction: column;
        }

        .lab-ruler-footer {
          left: 18px;
          right: 18px;
          font-size: 0.82rem;
          letter-spacing: 0.08em;
        }
      }
    </style>

      function totalDistanceForMoves(moves) {
        return moves.reduce((sum, move) => sum + Number(move.units || 0), 0);
      }

      function getEndPoint(start, moves) {
        return moves.reduce((point, move) => {
          if (move.dir === "right") return { x: point.x + move.units, y: point.y };
          if (move.dir === "left") return { x: point.x - move.units, y: point.y };
          if (move.dir === "up") return { x: point.x, y: point.y - move.units };
          if (move.dir === "down") return { x: point.x, y: point.y + move.units };
          return point;
        }, { x: start.x, y: start.y });
      }

      function getOrthogonalDisplacement(start, moves) {
        const end = getEndPoint(start, moves);
        return Math.abs(end.x - start.x) + Math.abs(end.y - start.y);
      }

      function build1DExplanation(startX, moves) {
        const distance = totalDistanceForMoves(moves);
        const end = getEndPoint({ x: startX, y: 0 }, moves);
        const displacement = Math.abs(end.x - startX);
        if (displacement === 0) {
          return `Distance is ${distance} total units of movement. Because the pirate ended where it started, the displacement is 0.`;
        }
        return `Distance is ${distance} total units of movement. The pirate ended ${displacement} units away from the starting point, so the displacement is ${displacement}.`;
      }

      function build2DExplanation(start, moves) {
        const distance = totalDistanceForMoves(moves);
        const end = getEndPoint(start, moves);
        const displacement = getOrthogonalDisplacement(start, moves);
        if (displacement === 0) {
          return `The pirate traveled ${distance} total units along the school hallways. Because the ending point matches the starting point, the displacement is 0.`;
        }
        const direction = end.x !== start.x ? "horizontal" : "vertical";
        return `The pirate traveled ${distance} total units along the school hallways. Because the pirate finished on the same ${end.x !== start.x ? "row" : "column"} as the start, the displacement is a straight ${direction} ${displacement} units.`;
      }

      function buildCompareExplanation(route1Distance, route2Distance, sharedDisplacement) {
        const longerText = route1Distance === route2Distance
          ? "Both routes traveled the same total distance."
          : route1Distance > route2Distance
            ? `Route 1 traveled ${route1Distance} units while Route 2 traveled ${route2Distance}, so Route 1 has more distance.`
            : `Route 2 traveled ${route2Distance} units while Route 1 traveled ${route1Distance}, so Route 2 has more distance.`;
        return `${longerText} Both routes start and end in the same places, so the shared displacement is ${sharedDisplacement}.`;
      }

      function make1DRound(config) {
        const start = { x: config.startX, y: 0 };
        const answers = {
          distance: totalDistanceForMoves(config.moves),
          displacement: getOrthogonalDisplacement(start, config.moves)
        };
        return {
          sourceId: config.sourceId || "",
          prompt: config.prompt,
          hintText: config.hintText || "",
          mapType: "1d",
          start,
          moves: config.moves,
          answers,
          explanation: config.explanation || build1DExplanation(config.startX, config.moves)
        };
      }

      function make2DRound(config) {
        const start = { x: config.start.x, y: config.start.y };
        const answers = {
          distance: totalDistanceForMoves(config.moves),
          displacement: getOrthogonalDisplacement(start, config.moves)
        };
        return {
          sourceId: config.sourceId || "",
          prompt: config.prompt,
          mapType: "2d",
          start,
          moves: config.moves,
          answers,
          explanation: config.explanation || build2DExplanation(start, config.moves)
        };
      }

      function makeCompareRound(config) {
        const route1Distance = totalDistanceForMoves(config.routes.A.moves);
        const route2Distance = totalDistanceForMoves(config.routes.B.moves);
        const sharedDisplacement = getOrthogonalDisplacement(config.routes.A.start, config.routes.A.moves);
        const route2Displacement = getOrthogonalDisplacement(config.routes.B.start, config.routes.B.moves);
        const longerRoute = route1Distance === route2Distance ? "same" : (route1Distance > route2Distance ? "1" : "2");
        if (route2Displacement !== sharedDisplacement) {
          console.warn("Compare round displacement mismatch", {
            prompt: config.prompt,
            route1Displacement: sharedDisplacement,
            route2Displacement
          });
        }
        return {
          sourceId: config.sourceId || "",
          prompt: config.prompt,
          mapType: "compare",
          routes: {
            A: {
              start: { ...config.routes.A.start },
              moves: config.routes.A.moves,
              answers: { distance: route1Distance, displacement: sharedDisplacement }
            },
            B: {
              start: { ...config.routes.B.start },
              moves: config.routes.B.moves,
              answers: { distance: route2Distance, displacement: sharedDisplacement }
            }
          },
          answers: {
            longerRoute,
            route1Distance,
            route2Distance,
            sharedDisplacement
          },
          explanation: config.explanation || buildCompareExplanation(route1Distance, route2Distance, sharedDisplacement)
        };
      }

      function shuffleArray(items) {
        const arr = items.slice();
        for (let i = arr.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function sampleOne(items) {
        return JSON.parse(JSON.stringify(items[Math.floor(Math.random() * items.length)]));
      }

      function sampleWithoutReplacement(items, count) {
        return shuffleArray(items).slice(0, count).map(item => JSON.parse(JSON.stringify(item)));
      }

        return GAME_DATA.levels[state.levelIndex];

        const level = getCurrentLevel();
        return level.rounds[state.roundIndex];

        if (!state.roundUi[key]) {
          state.roundUi[key] = {

            animationFinished: false,
            focusedRoute: "both",
            comparisonAnimating: false
          };
        }

            route1Distance: "",
            route2Distance: "",
            sharedDisplacement: ""

        return state.roundAnswers[key];

          </div>

      function renderExampleScreen() {
        return `
          <div class="screen">
            ${
              renderTopbar("Guided Example")
            }
            <div class="card split">
              <div>
                <h2 class="panel-title">Guided example</h2>
                <p class="subtle">
                  Watch the pirate move <strong>right 4</strong> and then <strong>left 2</strong>.

                <div class="prompt-box">

              <div>
                <div id="exampleMap" class="map-host"></div>
                <p class="map-caption">Example path: right 4, left 2</p>

      function renderLevelIntroScreen() {
        const level = getCurrentLevel();
        return `
          <div class="screen">
            ${
              renderTopbar(`Level ${state.levelIndex + 1} Introduction`)
            }
            <div class="card split">
              <div>
                <h2 class="panel-title">Level ${state.levelIndex + 1}: ${level.name}</h2>
                <p class="subtle">${level.shortIntro}</p>
                <div class="prompt-box">
                  <h3>Rounds in this level</h3>
                  <div class="subtle">${level.rounds.length} round${level.rounds.length > 1 ? "s" : ""}</div>
                </div>
                <div class="controls">
                  <button class="btn-primary" onclick="beginCurrentLevel()">Begin Level</button>
                  <button class="btn-secondary" onclick="resetGame()">Back to Start</button>
                </div>
              </div>
              <div class="card" style="background: #f7fbff; box-shadow: none; padding: 18px;">
                <div style="display:flex; align-items:center; gap:16px;">
                  <div class="small-mascot"><img src="${MASCOT_DATA_URI}" alt="Pirate mascot"></div>
                  <div>
                    <h3 style="margin:0 0 6px;">Pirate mission briefing</h3>
                    <div class="subtle">
                      ${
                        state.levelIndex === 0
                          ? "Count total movement versus the final position."
                          : state.levelIndex === 1
                            ? "Follow the school-map path and calculate distance versus displacement."

                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderRoundScreen() {
        const level = getCurrentLevel();
        const round = getCurrentRound();
        const subtitle = `Level ${state.levelIndex + 1} • Round ${state.roundIndex + 1} of ${level.rounds.length}`;
        const roundCard = level.type === "compare"
          ? renderCompareRound(round)
          : renderNumericRound(round);

        return `
          <div class="screen">
            ${
              renderTopbar(subtitle)
            }
            <div class="card mission-card">
              <div class="mission-copy">
                <div class="mission-pill">Level ${state.levelIndex + 1} • Round ${state.roundIndex + 1}</div>
                <h2 class="panel-title">${round.title}</h2>
                <p class="subtle">${round.prompt}</p>
                ${round.hintText ? `<div class="hint-banner">${round.hintText}</div>` : ""}
              </div>
              <div class="mission-watermark" aria-hidden="true"></div>
              <div class="mission-mascot">
                <div class="mission-compass" aria-hidden="true"></div>
                <div class="small-mascot"><img src="${MASCOT_DATA_URI}" alt="Pirate mascot"></div>
              </div>
            </div>
            ${state.submission.message ? `<div class="card parchment-card">${renderSubmissionStatus()}</div>` : ""}
            <div class="lab-stage">
              <div class="lab-prop lab-prop-left" aria-hidden="true">
                <div class="lab-glass-tower"></div>
                <div class="lab-flask lab-flask-large"></div>
                <div class="lab-flask lab-flask-small"></div>
              </div>
              <div class="lab-prop lab-prop-right" aria-hidden="true">
                <div class="lab-lantern"></div>
                <div class="lab-scroll"></div>
                <div class="lab-telescope"></div>
              </div>
              <div class="lab-main-column">
                <div class="activity-grid ${level.type === "compare" ? "compare-layout" : ""}">
                  ${roundCard}
                </div>
                ${renderRoundSupportCards(level.type)}
                <div class="lab-ruler-footer" aria-hidden="true">
                  <span>0</span>
                  <span>1</span>
                  <span>2</span>
                  <span>3</span>
                  <span>4</span>
                  <span>5</span>
                  <span>6</span>
                  <span>7</span>
                  <span>8</span>
                  <span>9</span>
                  <span>meters</span>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderNumericRound(round) {
        const saved = getAnswersForRound();
        return `
          <div class="activity-panel parchment-card">
            <div class="route-side">
              <div class="lab-section-plaque">⚓ Main Hallway (Route Map)</div>
              <div class="map-frame">
                <div class="map-frame-inner">
                  <div class="map-rose" aria-hidden="true"></div>
                  <div id="mainMap" class="map-host"></div>
                </div>
              </div>
              <div class="map-meter-label">meters</div>
              <p class="map-caption">Watch the pirate move. Then enter the distance and displacement.</p>
            </div>
            <div class="measurement-panel parchment-card">
              <div class="lab-section-plaque">⚗ Measurements</div>
              <div class="prompt-box measurement-box">
                <div class="measurement-header">Type your answers</div>
                <div class="answer-stack">
                  <div class="answer-row">
                    <div class="measurement-label-row">
                      <label for="distanceInput">Distance <span class="measurement-note">(total path taken)</span></label>
                      <span class="swatch-line distance"></span>
                    </div>
                    <div class="measurement-input-wrap">
                      <input id="distanceInput" type="number" inputmode="decimal" min="0" value="${escapeHtml(saved.distance || "")}" oninput="storeRoundNumericAnswer('distance', this.value)" disabled placeholder="Enter meters">
                      <span class="measurement-unit">m</span>
                    </div>
                  </div>
                  <div class="answer-row">
                    <div class="measurement-label-row">
                      <label for="displacementInput">Displacement <span class="measurement-note">(straight-line change)</span></label>
                      <span class="swatch-line displacement"></span>
                    </div>
                    <div class="measurement-input-wrap">
                      <input id="displacementInput" type="number" inputmode="decimal" min="0" value="${escapeHtml(saved.displacement || "")}" oninput="storeRoundNumericAnswer('displacement', this.value)" disabled placeholder="Enter meters">
                      <span class="measurement-unit">m</span>
                    </div>
                  </div>
                </div>
                <div class="helper-note">Inputs unlock after the animation finishes.</div>
                <div class="controls lab-action-row">
                  <button id="replayBtn" class="btn-secondary" onclick="replayCurrentRound()">↻ Replay Movement</button>
                  <button id="checkBtn" class="btn-primary" onclick="checkCurrentRound()" disabled>✓ Check Answer</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderLabelNumericRound(round) {
        // Inactive mode retained for possible future marker-label rounds.
        // Current GAME_DATA uses only numeric and compare levels.
        return `
          <div class="split">
            <div>
              <div id="mainMap" class="map-host"></div>
              <p class="map-caption">Use the numbered markers on the map to match each concept, then type the distance and displacement.</p>
            </div>
            <div>
              <div class="prompt-box">
                <h3>Part 1: Match the map markers</h3>
                <div class="helper-note">Each numbered marker points to one part of the map. Choose the correct label for each marker.</div>
                <div class="answer-stack" style="margin-top: 14px;">
                  ${[1,2,3,4].map(n => `
                    <div class="answer-row">
                      <label for="marker${n}Select">Marker ${n}</label>
                      <select id="marker${n}Select" disabled>
                        <option value="">Choose a label</option>
                        ${round.labels.map(label => `<option value="${label}">${label}</option>`).join("")}
                      </select>
                    </div>
                  `).join("")}
                </div>

                <h3 style="margin-top: 18px;">Part 2: Type the values</h3>
                <div class="answer-stack">
                  <div class="answer-row">
                    <label for="distanceInput">Distance</label>
                    <input id="distanceInput" type="number" inputmode="decimal" min="0" disabled>
                  </div>
                  <div class="answer-row">
                    <label for="displacementInput">Displacement</label>
                    <input id="displacementInput" type="number" inputmode="decimal" min="0" disabled>
                  </div>
                </div>

                <div class="controls">
                  <button id="clearLabelsBtn" class="btn-danger" onclick="clearLabels()" disabled>Reset Matches</button>
                  <button id="replayBtn" class="btn-secondary" onclick="replayCurrentRound()">Replay Path</button>
                  <button id="checkBtn" class="btn-primary" onclick="checkCurrentRound()" disabled>Check Answer</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderCompareRound(round) {
        const ui = getUiForRound();
        const focusMode = ui.focusedRoute || "both";
        const focusDisabled = ui.comparisonAnimating || !ui.animationFinished;
        const saved = getAnswersForRound();
        return `
          <div class="activity-panel parchment-card compare-activity-panel">
            <div>
              <div class="lab-section-plaque">⚓ Route Maps</div>
              <div class="compare-focus-row">
                <button class="${focusMode === "both" ? "btn-primary" : "btn-secondary"}" onclick="setFocusedRoute('both')" ${focusDisabled ? "disabled" : ""}>Show Both Routes</button>
                <button class="${focusMode === "A" ? "btn-primary" : "btn-secondary"}" onclick="setFocusedRoute('A')" ${focusDisabled ? "disabled" : ""}>Focus Route 1</button>
                <button class="${focusMode === "B" ? "btn-primary" : "btn-secondary"}" onclick="setFocusedRoute('B')" ${focusDisabled ? "disabled" : ""}>Focus Route 2</button>
              </div>
              <div class="compare-grid ${focusMode === "A" ? "focus-a" : focusMode === "B" ? "focus-b" : ""}">
                <div class="route-card route-a">
                  <h3>Route 1</h3>
                  <div id="compareMapA" class="map-host"></div>
                  <div class="route-note">Watch Route 1 first. Use <strong>Focus Route 1</strong> if you want to enlarge it.</div>
                </div>
                <div class="route-card route-b">
                  <h3>Route 2</h3>
                  <div id="compareMapB" class="map-host"></div>
                  <div class="route-note">Then compare it to Route 2. Use <strong>Focus Route 2</strong> when you want a bigger view.</div>
                </div>
              </div>
            </div>
            <div class="measurement-panel parchment-card">
              <div class="lab-section-plaque">⚗ Compare the Routes</div>
              <div class="prompt-box measurement-box">
                <fieldset id="compareFieldset" disabled>
                  <legend>Compare the routes</legend>
                  <div class="option-stack">
                    <div>
                      <strong>1. Which route had more distance?</strong>
                      <div class="option-stack" style="margin-top: 8px;">
                        <label class="radio-row"><input type="radio" name="longerRoute" value="1" onchange="storeCompareAnswers()" ${saved.longerRoute === "1" ? "checked" : ""}> Route 1</label>
                        <label class="radio-row"><input type="radio" name="longerRoute" value="2" onchange="storeCompareAnswers()" ${saved.longerRoute === "2" ? "checked" : ""}> Route 2</label>
                        <label class="radio-row"><input type="radio" name="longerRoute" value="same" onchange="storeCompareAnswers()" ${saved.longerRoute === "same" ? "checked" : ""}> Same distance</label>
                      </div>
                    </div>

                    <div>
                      <strong>2. Distance for Route 1</strong>
                      <div class="measurement-input-wrap" style="margin-top:8px;">
                        <input id="route1DistanceInput" type="number" inputmode="decimal" min="0" value="${saved.route1Distance || ""}" oninput="storeCompareAnswers()" placeholder="Enter meters">
                        <span class="measurement-unit">m</span>
                      </div>
                    </div>

                    <div>
                      <strong>3. Distance for Route 2</strong>
                      <div class="measurement-input-wrap" style="margin-top:8px;">
                        <input id="route2DistanceInput" type="number" inputmode="decimal" min="0" value="${saved.route2Distance || ""}" oninput="storeCompareAnswers()" placeholder="Enter meters">
                        <span class="measurement-unit">m</span>
                      </div>
                    </div>

                    <div>
                      <strong>4. What was the displacement for both routes?</strong>
                      <div class="measurement-input-wrap" style="margin-top:8px;">
                        <input id="sharedDisplacementInput" type="number" inputmode="decimal" min="0" value="${saved.sharedDisplacement || ""}" oninput="storeCompareAnswers()" placeholder="Enter meters">
                        <span class="measurement-unit">m</span>
                      </div>
                    </div>
                  </div>
                </fieldset>

                <div class="controls lab-action-row">
                  <button id="replayBtn" class="btn-secondary" onclick="replayCurrentRound()">↻ Replay Routes</button>
                  <button id="checkBtn" class="btn-primary" onclick="checkCurrentRound()" disabled>✓ Check Answer</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderRoundSupportCards(levelType) {
        const conceptText = levelType === "compare"
          ? `
              <p><strong class="distance-text">Distance</strong> can be different for two routes even when both routes begin and end at the same places.</p>
              <p><strong class="displacement-text">Displacement</strong> stays the same if the start and finish points stay the same.</p>
            `
          : `
              <p><strong class="distance-text">Distance</strong> is how much ground was covered.</p>
              <p><strong class="displacement-text">Displacement</strong> is how far the pirate is from where they started, in a straight line.</p>
            `;

        return `
          <div class="support-grid">
            <div class="support-card legend-card parchment-card">
              <div class="support-card-title">Legend</div>
              <div class="legend-line-item"><span class="legend-line distance-line"></span>Distance (Total Path)</div>
              <div class="support-copy">Actual path the pirate travels</div>
              <div class="legend-line-item"><span class="legend-line displacement-line"></span>Displacement (Straight-Line)</div>
              <div class="support-copy">Shortest straight-line from start to finish</div>
            </div>
            <div class="support-card concept-card parchment-card">
              <div class="support-card-title">Concept Check</div>
              <div class="support-copy">${conceptText}</div>
            </div>
            <div class="support-card units-card parchment-card">
              <div class="support-card-title">Units</div>
              <div class="support-copy">All measurements are in meters (m).</div>
              <div class="support-copy">Use whole numbers or decimals.</div>
            </div>
          </div>
        `;
      }

      function renderFeedbackScreen() {
        const fb = state.feedback;
        const subtitle = `Level ${fb.levelNumber} • Round ${fb.roundNumber} feedback`;

        return `
          <div class="screen">
            ${
              renderTopbar(subtitle)
            }
            <div class="card">
              <div class="result-banner ${fb.score === fb.maxScore ? "good" : "bad"}">
                ${fb.score === fb.maxScore ? "Nice work." : "Round checked."} You earned ${fb.score} out of ${fb.maxScore} point${fb.maxScore === 1 ? "" : "s"}.
              </div>
            </div>
            ${state.submission.message ? `<div class="card">${renderSubmissionStatus()}</div>` : ""}
            <div class="card feedback-grid">
              <div>
                <div id="feedbackMapHost"></div>
              </div>
              <div>
                <h2 class="panel-title">Answer breakdown</h2>
                <ul class="check-list">
                  ${
                    fb.items.map(item => `
                      <li>
                        <strong class="${item.correct ? "check-good" : "check-bad"}">${item.correct ? "Correct" : "Needs fixing"} • ${item.label}</strong>
                        <div>Your answer: ${item.student}</div>
                        <div>Correct answer: ${item.correctAnswer}</div>
                      </li>
                    `).join("")
                  }
                </ul>
                <div class="prompt-box" style="margin-top: 14px;">
                  <h3>Why</h3>
                  <div class="subtle">${fb.explanation}</div>
                </div>
                <div class="controls">
                  <button class="btn-primary" onclick="nextFromFeedback()">${fb.isLastRoundOverall ? "See Results" : fb.isLastRoundInLevel ? "Finish Level" : "Next Round"}</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderLevelEndScreen() {
        const finishedLevel = getCurrentLevel();
        const nextLevel = GAME_DATA.levels[state.levelIndex + 1];
        const totals = getLevelScore(state.levelIndex);

        return `
          <div class="screen">
            ${
              renderTopbar(`Level ${state.levelIndex + 1} complete`)
            }
            ${state.submission.message ? `<div class="card">${renderSubmissionStatus()}</div>` : ""}
            <div class="card split">
              <div>
                <h2 class="panel-title">Level complete: ${finishedLevel.name}</h2>
                <div class="big-score">${totals.score} / ${totals.max}</div>
                <p class="subtle">
                  Great. This level is done. The next level will build on the same idea with a new kind of task.
                </p>
                <div class="controls">
                  <button class="btn-primary" onclick="goToNextLevelIntro()">Start Level ${state.levelIndex + 2}</button>
                  <button class="btn-secondary" onclick="resetGame()">Back to Start</button>
                </div>
              </div>
              <div class="card" style="background:#f7fbff; box-shadow:none; padding:18px;">
                <h3 style="margin-top:0;">Next up</h3>
                <div class="subtle">
                  <strong>${nextLevel ? nextLevel.name : "Results"}</strong><br>
                  ${nextLevel ? nextLevel.shortIntro : "You are done with the game."}
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderReflectionScreen() {
        return `
          <div class="screen">
            ${renderTopbar("Reflection questions")}
            ${state.submission.message ? `<div class="card">${renderSubmissionStatus()}</div>` : ""}
            <div class="card split">
              <div>
                <h2 class="panel-title">Reflection check</h2>
                <p class="subtle">Answer all four multiple-choice questions. Each reflection question is worth <strong>4 points</strong>.</p>
                <div class="callout">
                  These reflection questions count together with the game score toward the final Canvas grade.
                </div>
              </div>
              <div class="prompt-box">
                <h3 style="margin-top:0;">Student</h3>
                <div><strong>${escapeHtml(state.student.firstName)} ${escapeHtml(state.student.lastName)}</strong></div>
                <div class="subtle">${escapeHtml(state.student.classPeriod)}</div>
              </div>
            </div>
            <div class="card">
              ${REFLECTION_QUESTIONS.map((question, idx) => `
                <div class="review-item">
                  <strong>${idx + 1}. ${question.prompt}</strong>
                  ${Object.entries(question.options).map(([key, label]) => `
                    <label class="mc-option"><input type="radio" name="reflection-${question.id}" value="${key}" onchange="storeReflectionAnswer('${question.id}', '${key}')" ${state.reflections[question.id] === key ? "checked" : ""}> ${key}. ${label}</label>
                  `).join("")}
                </div>
              `).join("")}
              <div id="reflectionErrorHost"></div>
              <div class="controls">
                <button class="btn-secondary" onclick="backToResultsFromReflection()">Back</button>
                <button class="btn-primary" onclick="finishReflections()">See Final Results</button>
              </div>
            </div>
          </div>
        `;
      }

      function renderResultsScreen() {
        const metrics = getAssessmentMetrics();
        const badge = metrics.percent >= 90 ? "Pirate Path Master" : metrics.percent >= 70 ? "Hallway Navigator" : "Path Rookie";
        const submitDisabled = !reflectionsComplete() || state.submission.status === "submitting";

        return `
          <div class="screen">
            ${renderTopbar("Final results")}
            <div class="card">
              <div class="split">
                <div>
                  <span class="pill">Final Badge</span>
                  <h2 class="panel-title" style="margin-top:10px;">${badge}</h2>
                  <div class="big-score">${metrics.preAdjustedEarned} / ${metrics.preAdjustedMax}</div>
                  <p class="subtle">Pre-adjusted grade</p>
                  <div class="summary-metric-grid">
                    <div class="metric-card">
                      <h4>Game score</h4>
                      <div class="metric-value">${metrics.game.score} / ${metrics.game.max}</div>
                    </div>
                    <div class="metric-card">
                      <h4>Reflection score</h4>
                      <div class="metric-value">${metrics.reflection.score} / ${metrics.reflection.max}</div>
                    </div>
                    <div class="metric-card">
                      <h4>Percent</h4>
                      <div class="metric-value">${metrics.percent}%</div>
                    </div>
                    <div class="metric-card">
                      <h4>Canvas grade</h4>
                      <div class="metric-value">${metrics.canvasGrade.toFixed(2)} / 20</div>
                    </div>
                  </div>
                  <div class="controls" style="margin-top:16px;">
                    <button class="btn-primary" onclick="submitResults()" ${submitDisabled ? "disabled" : ""}>${state.submission.status === "submitting" ? "Submitting..." : state.submission.submitted ? "Submitted" : "Submit Results"}</button>
                    <button class="btn-secondary" onclick="resetGame()">Play Again</button>
                    <button class="btn-secondary" onclick="toggleReview()">${state.showReview ? "Hide Review" : "Review Answers"}</button>
                  </div>
                  ${renderSubmissionStatus()}
                </div>
                <div class="summary-grid">
                  ${GAME_DATA.levels.map((level, idx) => {
                    const levelScore = getLevelScore(idx);
                    return `
                      <div class="summary-card">
                        <h3>Level ${idx + 1}</h3>
                        <div><strong>${level.name}</strong></div>
                        <div style="margin-top:10px; font-size: 1.15rem; font-weight: 800;">${levelScore.score} / ${levelScore.max}</div>
                      </div>
                    `;
                  }).join("")}
                  <div class="summary-card">
                    <h3>Student</h3>
                    <div><strong>${escapeHtml(state.student.firstName)} ${escapeHtml(state.student.lastName)}</strong></div>
                    <div style="margin-top:10px;">${escapeHtml(state.student.classPeriod)}</div>
                  </div>
                </div>
              </div>

              ${state.showReview ? renderReviewPanel() : ""}
            </div>
          </div>
        `;
      }

      function renderReviewPanel() {
        const results = Object.values(state.roundResults).sort((a, b) => a.sortOrder - b.sortOrder);
        return `
          <div class="review-panel">
            <h3 style="margin-top:0;">Round review</h3>
            ${
              results.map(result => `

      function getReflectionScore() {
        let score = 0;
        const items = REFLECTION_QUESTIONS.map(question => {
          const studentAnswer = state.reflections[question.id] || "";
          const correct = studentAnswer === question.correct;
          const pointsEarned = correct ? question.points : 0;
          score += pointsEarned;
          return {
            id: question.id,
            prompt: question.prompt,
            studentAnswer,
            correctAnswer: question.correct,
            correct,
            pointsEarned,
            pointsPossible: question.points
          };
        });
        return { score, max: REFLECTION_QUESTIONS.reduce((sum, q) => sum + q.points, 0), items };
      }

      function buildReflectionSubmissionItems(completedOverride) {
        return REFLECTION_QUESTIONS.map(question => {
          const studentAnswer = state.reflections[question.id] || "";
          const answered = !!studentAnswer;
          const correct = answered && studentAnswer === question.correct;
          const shouldScore = completedOverride || answered;
          return {
            id: question.id,
            prompt: question.prompt,
            studentAnswer,
            correctAnswer: question.correct,
            correct: shouldScore ? correct : "",
            pointsEarned: shouldScore ? (correct ? question.points : 0) : "",
            pointsPossible: question.points,
            responseStatus: shouldScore ? "scored" : "draft"
          };
        });
      }

      function getQuestionSetSummary() {
        return GAME_DATA.levels.map((level, levelIdx) => {
          const ids = level.rounds.map((round, roundIdx) => round.sourceId || `L${levelIdx + 1}Q${roundIdx + 1}`);
          return `L${levelIdx + 1}:${ids.join(",")}`;
        }).join(" | ");
      }

      function getProgressStageLabel() {
        if (state.mode === "round" || state.mode === "feedback") {
          return `Level ${state.levelIndex + 1} Round ${state.roundIndex + 1}`;
        }
        if (state.mode === "levelEnd") {
          return `Finished Level ${state.levelIndex + 1}`;
        }
        if (state.mode === "reflection") {
          return "Reflection questions";
        }
        if (state.mode === "results") {
          return "Results screen";
        }
        if (state.mode === "tutorial" || state.mode === "example") {
          return "Tutorial / example";
        }
        return "In progress";
      }

      function getAssessmentMetrics() {
        const game = getTotalScore();
        const reflection = getReflectionScore();
        const preAdjustedEarned = game.score + reflection.score;
        const preAdjustedMax = game.max + reflection.max;
        const percent = preAdjustedMax ? Number(((preAdjustedEarned / preAdjustedMax) * 100).toFixed(2)) : 0;
        const canvasGrade = preAdjustedMax ? (preAdjustedEarned / preAdjustedMax) * 20 : 0;
        return {
          game,
          reflection,
          preAdjustedEarned,
          preAdjustedMax,
          percent,
          canvasGrade
        };
      }

      function renderSubmissionStatus() {
        if (!state.submission.message) return "";
        const tone = state.submission.status === "error"
          ? "bad"
          : state.submission.status === "submitting"
            ? "info"
            : "good";
        return `<div class="status-banner ${tone}">${state.submission.message}</div>`;
      }

      function hasTypedValue(value) {
        return value !== null && value !== undefined && String(value).trim() !== "";
      }

      function parseStoredNumberValue(value) {
        if (!hasTypedValue(value)) return null;
        const num = Number(String(value).trim());
        return Number.isFinite(num) ? num : null;
      }

      function currentTimestampIso() {
        return new Date().toISOString();
      }

      function getDurationSeconds(endTimeIso) {
        if (!state.startedAt) return "";
        const started = new Date(state.startedAt).getTime();
        const ended = new Date(endTimeIso).getTime();
        if (!Number.isFinite(started) || !Number.isFinite(ended)) return "";
        return Math.max(0, Math.round((ended - started) / 1000));
      }

      function buildScoredRoundSubmissions() {
        return Object.values(state.roundResults)
          .sort((a, b) => a.sortOrder - b.sortOrder)
          .map(result => ({
            levelNumber: result.levelNumber,
            roundNumber: result.roundNumber,
            roundTitle: result.title,
            questionId: result.questionId,
            prompt: result.prompt,
            questionType: result.questionType,
            responseStatus: "scored",
            score: result.score,
            maxScore: result.maxScore,
            items: result.items.map(item => ({
              ...item,
              pointsEarned: item.correct === true ? 1 : 0,
              pointsPossible: 1
            }))
          }));
      }

      function buildDraftRoundSubmission() {
        if (state.mode !== "round") return null;

        const key = getRoundKey();
        if (state.roundResults[key]) return null;

        const level = getCurrentLevel();
        const round = getCurrentRound();
        const answers = getAnswersForRound(key);

        if (level.type === "compare") {
          const hasAnyAnswer = [
            answers.longerRoute,
            answers.route1Distance,
            answers.route2Distance,
            answers.sharedDisplacement
          ].some(hasTypedValue);

          if (!hasAnyAnswer) return null;

          return {
            levelNumber: state.levelIndex + 1,
            roundNumber: state.roundIndex + 1,
            roundTitle: round.title,
            questionId: round.sourceId || round.id || key,
            prompt: round.prompt,
            questionType: level.type,
            responseStatus: "draft",
            score: "",
            maxScore: 4,
            items: [
              {
                label: "Route with more distance",
                student: formatRouteChoiceLabel(answers.longerRoute),
                correctAnswer: formatRouteChoiceLabel(round.answers.longerRoute),
                correct: "",
                pointsEarned: "",
                pointsPossible: 1
              },
              {
                label: "Distance for Route 1",
                student: hasTypedValue(answers.route1Distance) ? answers.route1Distance : "",
                correctAnswer: String(round.answers.route1Distance),
                correct: "",
                pointsEarned: "",
                pointsPossible: 1
              },
              {
                label: "Distance for Route 2",
                student: hasTypedValue(answers.route2Distance) ? answers.route2Distance : "",
                correctAnswer: String(round.answers.route2Distance),
                correct: "",
                pointsEarned: "",
                pointsPossible: 1
              },
              {
                label: "Displacement for both routes",
                student: hasTypedValue(answers.sharedDisplacement) ? answers.sharedDisplacement : "",
                correctAnswer: String(round.answers.sharedDisplacement),
                correct: "",
                pointsEarned: "",
                pointsPossible: 1
              }
            ]
          };
        }

        const hasAnyNumber = [answers.distance, answers.displacement].some(hasTypedValue);
        if (!hasAnyNumber) return null;

        return {
          levelNumber: state.levelIndex + 1,
          roundNumber: state.roundIndex + 1,
          roundTitle: round.title,
          questionId: round.sourceId || round.id || key,
          prompt: round.prompt,
          questionType: level.type,
          responseStatus: "draft",
          score: "",
          maxScore: 2,
          items: [
            {
              label: "Distance",
              student: hasTypedValue(answers.distance) ? answers.distance : "",
              correctAnswer: String(round.answers.distance),
              correct: "",
              pointsEarned: "",
              pointsPossible: 1
            },
            {
              label: "Displacement",
              student: hasTypedValue(answers.displacement) ? answers.displacement : "",
              correctAnswer: String(round.answers.displacement),
              correct: "",
              pointsEarned: "",
              pointsPossible: 1
            }
          ]
        };
      }

      function buildSubmissionPayload(completedOverride = true) {
        const metrics = getAssessmentMetrics();
        const level1 = getLevelScore(0);
        const level2 = getLevelScore(1);
        const level3 = getLevelScore(2);
        const endTime = currentTimestampIso();
        const rounds = buildScoredRoundSubmissions();
        const draftRound = buildDraftRoundSubmission();
        if (!completedOverride && draftRound) {
          rounds.push(draftRound);
        }

        return {
          sessionId: state.sessionId,
          gameVersion: GAME_VERSION,
          completed: completedOverride === true,
          submissionType: completedOverride ? "normal" : "emergency",
          progressStage: completedOverride ? "complete" : getProgressStageLabel(),
          startTime: state.startedAt,
          endTime,
          durationSeconds: getDurationSeconds(endTime),
          student: {
            firstName: state.student.firstName,
            lastName: state.student.lastName,
            classPeriod: state.student.classPeriod
          },
          summary: {
            score: metrics.preAdjustedEarned,
            scoreMax: metrics.preAdjustedMax,
            reflectionScore: metrics.reflection.score,
            reflectionMax: metrics.reflection.max,
            percent: metrics.percent,
            canvasGrade: Number(metrics.canvasGrade.toFixed(2)),
            level1Score: level1.score,
            level1Max: level1.max,
            level2Score: level2.score,
            level2Max: level2.max,
            level3Score: level3.score,
            level3Max: level3.max,
            questionSetSummary: getQuestionSetSummary()
          },
          rounds,
          reflections: buildReflectionSubmissionItems(completedOverride)
        };
      }

      function submitEmergencyNow() {
        if (state.submission.status === "submitting") return;
        if (!ensureStudentIdentity()) return;

        const confirmed = window.confirm("Submit current progress now? Unfinished questions will be left blank and this attempt will be marked incomplete.");
        if (!confirmed) return;

        captureCurrentRoundDraft();
        state.submission.status = "submitting";
        state.submission.message = "Saving your current progress...";
        renderApp();

        const payload = buildSubmissionPayload(false);
        google.script.run
          .withSuccessHandler(response => {
            state.submission.status = "success";
            state.submission.message = response && response.message ? response.message : "Current progress saved.";
            state.submission.submitted = false;
            state.submission.lastSubmissionType = "emergency";
            state.submission.response = response || null;
            alert(state.submission.message);
            renderApp();
          })
          .withFailureHandler(error => {
            state.submission.status = "error";
            state.submission.message = (error && error.message) ? error.message : "Something went wrong while saving the emergency submission.";
            alert(state.submission.message);
            renderApp();
          })
          .submitPiratePathSubmission(payload);
      }

      function submitResults() {
        if (state.submission.status === "submitting" || state.submission.submitted) return;
        if (!reflectionsComplete()) {
          state.mode = "reflection";
          renderApp();
          return;
        }
        captureCurrentRoundDraft();
        state.submission.status = "submitting";
        state.submission.message = "Submitting your results to the teacher sheet...";
        renderApp();

        const payload = buildSubmissionPayload(true);
        google.script.run
          .withSuccessHandler(response => {
            state.submission.status = "success";
            state.submission.message = response && response.message ? response.message : "Results submitted successfully.";
            state.submission.submitted = true;
            state.submission.lastSubmissionType = "complete";
            state.submission.response = response || null;
            renderApp();
          })
          .withFailureHandler(error => {
            state.submission.status = "error";
            state.submission.message = (error && error.message) ? error.message : "Something went wrong while saving the results.";
            renderApp();
          })
          .submitPiratePathSubmission(payload);
      }
