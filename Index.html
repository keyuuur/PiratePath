      function playComparisonRound(forceReplay = false) {
        const key = getRoundKey();
        const ui = getUiForRound(key);
        if (ui.comparisonAnimating && !forceReplay) return;

        ui.comparisonAnimating = true;
        ui.hasPlayed = true;
        ui.animationFinished = false;
        document.getElementById("compareFieldset").disabled = true;
        document.getElementById("checkBtn").disabled = true;
        setCompareFocusControlsEnabled(false);

        const runId = ++state.animationRunId;
        const round = getCurrentRound();

        animateRoute("compareMapA", {
          mapType: "2d",
          start: round.routes.A.start,
          moves: round.routes.A.moves,
          answers: round.routes.A.answers
        }, runId).then(() => {
          if (runId !== state.animationRunId) return;
          return sleep(260);
        }).then(() => {
          if (runId !== state.animationRunId) return;
          return animateRoute("compareMapB", {
            mapType: "2d",
            start: round.routes.B.start,
            moves: round.routes.B.moves,
            answers: round.routes.B.answers
          }, runId);
        }).then(() => {
          if (runId !== state.animationRunId) return;
          ui.comparisonAnimating = false;
          ui.animationFinished = true;
          document.getElementById("compareFieldset").disabled = false;
          document.getElementById("checkBtn").disabled = false;
          setCompareFocusControlsEnabled(true);
        });
      }

      function checkCurrentRound() {
        const level = getCurrentLevel();
        const round = getCurrentRound();
        captureCurrentRoundDraft();

        if (level.type === "numeric") {
          const answers = getAnswersForRound();
          const studentDistance = parseStoredNumberValue(answers.distance);
          const studentDisplacement = parseStoredNumberValue(answers.displacement);

          const items = [
            {
              label: "Distance",
              student: valueOrDash(studentDistance),
              correctAnswer: String(round.answers.distance),
              correct: studentDistance === round.answers.distance
            },
            {
              label: "Displacement",
              student: valueOrDash(studentDisplacement),
              correctAnswer: String(round.answers.displacement),
              correct: studentDisplacement === round.answers.displacement
            }
          ];

          saveFeedbackAndAdvance({
            type: level.type,
            round,
            items,
            explanation: round.explanation,
            score: items.filter(x => x.correct).length,
            maxScore: 2
          });
          return;
        }

        if (level.type === "labelNumeric") {
          const studentDistance = readNumber("distanceInput");
          const studentDisplacement = readNumber("displacementInput");
          const correctAssignments = {
            marker1: "Start",
            marker2: "End",
            marker3: "Distance Path",
            marker4: "Displacement Arrow"
          };

          const labelItems = Object.keys(correctAssignments).map(markerKey => {
            const el = document.getElementById(`${markerKey}Select`);
            const studentValue = el && el.value ? el.value : "—";
            const answer = correctAssignments[markerKey];
            return {
              label: `Marker ${markerKey.replace("marker", "")}`,
              student: studentValue,
              correctAnswer: answer,
              correct: studentValue === answer
            };
          });

          const numberItems = [
            {
              label: "Distance",
              student: valueOrDash(studentDistance),
              correctAnswer: String(round.answers.distance),
              correct: studentDistance === round.answers.distance
            },
            {
              label: "Displacement",
              student: valueOrDash(studentDisplacement),
              correctAnswer: String(round.answers.displacement),
              correct: studentDisplacement === round.answers.displacement
            }
          ];

          const items = [...labelItems, ...numberItems];

          saveFeedbackAndAdvance({
            type: level.type,
            round,
            items,
            explanation: round.explanation,
            score: items.filter(x => x.correct).length,
            maxScore: 2,
            correctAssignments
          });
          return;
        }

        if (level.type === "compare") {
          const answers = getAnswersForRound();
          const longerRoute = answers.longerRoute || "";
          const route1Distance = parseStoredNumberValue(answers.route1Distance);
          const route2Distance = parseStoredNumberValue(answers.route2Distance);
          const sharedDisplacement = parseStoredNumberValue(answers.sharedDisplacement);

          const items = [
            {
              label: "Route with more distance",
              student: formatRouteChoiceLabel(longerRoute) || "—",
              correctAnswer: formatRouteChoiceLabel(round.answers.longerRoute),
              correct: longerRoute === round.answers.longerRoute
            },
            {
              label: "Distance for Route 1",
              student: valueOrDash(route1Distance),
              correctAnswer: String(round.answers.route1Distance),
              correct: route1Distance === round.answers.route1Distance
            },
            {
              label: "Distance for Route 2",
              student: valueOrDash(route2Distance),
              correctAnswer: String(round.answers.route2Distance),
              correct: route2Distance === round.answers.route2Distance
            },
            {
              label: "Displacement for both routes",
              student: valueOrDash(sharedDisplacement),
              correctAnswer: String(round.answers.sharedDisplacement),
              correct: sharedDisplacement === round.answers.sharedDisplacement
            }
          ];

          saveFeedbackAndAdvance({
            type: level.type,
            round,
            items,
            explanation: round.explanation,
            score: items.filter(x => x.correct).length,
            maxScore: 4
          });
        }
      }

      function saveFeedbackAndAdvance(payload) {
        const totalLevels = GAME_DATA.levels.length;
        const currentLevel = getCurrentLevel();
        const isLastRoundInLevel = state.roundIndex === currentLevel.rounds.length - 1;
        const isLastRoundOverall = isLastRoundInLevel && state.levelIndex === totalLevels - 1;

        const feedback = {
          ...payload,
          levelNumber: state.levelIndex + 1,
          roundNumber: state.roundIndex + 1,
          isLastRoundInLevel,
          isLastRoundOverall
        };

        const key = getRoundKey();
        state.roundResults[key] = {
          title: payload.round.title,
          questionId: payload.round.sourceId || payload.round.id || key,
          prompt: payload.round.prompt,
          questionType: payload.type,
          score: payload.score,
          maxScore: payload.maxScore,
          explanation: payload.explanation,
          sortOrder: state.levelIndex * 100 + state.roundIndex,
          levelNumber: state.levelIndex + 1,
          roundNumber: state.roundIndex + 1,
          items: payload.items
        };

        state.feedback = feedback;
        state.mode = "feedback";
        renderApp();
      }

      function getTotalScore() {
        const results = Object.values(state.roundResults);
        const max = GAME_DATA.levels.reduce((sum, level) => {
          const perRound = level.type === "compare" ? 4 : 2;
          return sum + level.rounds.length * perRound;
        }, 0);

        return {
          score: results.reduce((sum, item) => sum + item.score, 0),
          max
        };
      }

      function getLevelScore(levelIndex) {
        const level = GAME_DATA.levels[levelIndex];
        const maxByType = level.type === "compare"
          ? level.rounds.length * 4
          : level.rounds.length * 2;

        let score = 0;
        level.rounds.forEach((round, idx) => {
          const key = getRoundKey(levelIndex, idx);
          if (state.roundResults[key]) score += state.roundResults[key].score;
        });

        return { score, max: maxByType };
      }

      function readNumber(id) {
        const el = document.getElementById(id);
        if (!el) return null;
        const raw = el.value.trim();
        if (raw === "") return null;
        const num = Number(raw);
        return Number.isFinite(num) ? num : null;
      }

      function valueOrDash(value) {
        return value === null || value === undefined || value === "" ? "—" : String(value);
      }

      function getCheckedValue(name) {
        const checked = document.querySelector(`input[name="${name}"]:checked`);
        return checked ? checked.value : null;
      }

      function normalizeLabel(label) {
        return String(label || "").trim().toLowerCase();
      }

      function capitalize(str) {
        return str.charAt(0).toUpperCase() + str.slice(1);
      }


      function makeStablePromptId(prompt, prefix) {
        const cleaned = String(prompt || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 42);
        return `${prefix}-${cleaned || "question"}`;
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function renderSingleMap(containerId, round, options = {}) {
        const config = round.mapType === "1d" ? get1DConfig(round) : get2DConfig();
        const container = document.getElementById(containerId);
        if (!container) return;

        const svg = buildMapShellSvg(containerId, config, round, options);
        container.innerHTML = svg;

        if (options.showCompletedState) {
          drawStaticState(containerId, round);
          if (round.mapType === "2d" && options.feedbackAssignments) {
            renderConceptMarkers(containerId, round, options.feedbackAssignments, "feedback");
          } else if (round.mapType === "2d" && options.interactiveTargets) {
            renderConceptMarkers(containerId, round);
          }
          return;
        }

        if (options.autoPlay) {
          const shouldTrackRoundUi = options.trackRoundUi === true;
          const runId = ++state.animationRunId;
          let ui = null;

          if (shouldTrackRoundUi) {
            const key = getRoundKey();
            ui = getUiForRound(key);
            ui.hasPlayed = true;
            ui.animationFinished = false;
          }

          animateRoute(containerId, round, runId, options.interactiveTargets).then(() => {
            if (runId !== state.animationRunId) return;
            if (shouldTrackRoundUi && ui) {
              ui.animationFinished = true;
              setRoundInputsEnabled(true);
            }
          });
        }
      }

      function get1DConfig(round) {
        const points = buildExpandedPath(round.start, round.moves);
        const maxX = Math.max(...points.map(point => point.x), 9);
        const cols = maxX + 1;
        const width = MAP_CONFIG.marginX * 2 + cols * MAP_CONFIG.cell;
        const height = MAP_CONFIG.hallwayHeight;
        return {
          kind: "1d",
          cols,
          rows: 1,
          width,
          height,
          cell: MAP_CONFIG.cell,
          marginX: MAP_CONFIG.marginX,
          marginY: 0
        };
      }

      function get2DConfig() {
        const cols = MAP_CONFIG.mapCols2D;
        const rows = MAP_CONFIG.mapRows2D;
        const width = MAP_CONFIG.marginX * 2 + cols * MAP_CONFIG.cell;
        const height = MAP_CONFIG.marginY * 2 + rows * MAP_CONFIG.cell;

        return {
          kind: "2d",
          cols,
          rows,
          width,
          height,
          cell: MAP_CONFIG.cell,
          marginX: MAP_CONFIG.marginX,
          marginY: MAP_CONFIG.marginY
        };
      }

      function buildMapShellSvg(containerId, config, round, options = {}) {
        const shellClass = config.kind === "1d" ? "map-shell hallway-shell" : "map-shell school-shell";
        const backdrop = config.kind === "1d"
          ? buildHallwayBackdrop(config)
          : buildSchoolBackdrop(config);
        const startPx = pointToPx(config, round.start);
        const flagMarkup = config.kind === "1d"
          ? build1DFlagMarkup(containerId, round, config)
          : "";

        return `
          <div class="${shellClass}" id="${containerId}-shell" style="aspect-ratio: ${config.width} / ${config.height};">
            <svg viewBox="0 0 ${config.width} ${config.height}" aria-hidden="true">
              <defs>
                <marker id="arrowhead-${containerId}" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                  <path d="M0,0 L6,3 L0,6 z" fill="var(--arrow)"></path>
                </marker>
                <clipPath id="clip-${containerId}" clipPathUnits="userSpaceOnUse">
                  <circle cx="0" cy="0" r="25"></circle>
                </clipPath>
              </defs>

              ${backdrop}
              ${flagMarkup}

              <polyline id="${containerId}-path" fill="none" stroke="var(--path)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" points=""></polyline>
              <circle id="${containerId}-start" cx="${startPx.x}" cy="${startPx.y}" r="11" fill="#ffffff" stroke="var(--green)" stroke-width="5"></circle>
              <circle id="${containerId}-end" cx="${startPx.x}" cy="${startPx.y}" r="11" fill="#ffffff" stroke="var(--gold)" stroke-width="5" opacity="0"></circle>

              <line id="${containerId}-arrow" x1="${startPx.x}" y1="${startPx.y}" x2="${startPx.x}" y2="${startPx.y}" stroke="var(--arrow)" stroke-width="6" stroke-linecap="round" marker-end="url(#arrowhead-${containerId})" opacity="0"></line>

              <g id="${containerId}-zeroBadge" opacity="0">
                <circle cx="${startPx.x + 36}" cy="${startPx.y - 36}" r="24" fill="#eff6ff" stroke="var(--arrow)" stroke-width="4"></circle>
                <text x="${startPx.x + 36}" y="${startPx.y - 29}" text-anchor="middle" font-size="18" font-weight="800" fill="#27548a">0</text>
              </g>

              <g id="${containerId}-token" transform="translate(${startPx.x}, ${startPx.y})">
                <circle cx="0" cy="0" r="32" fill="#f7fbff" stroke="var(--green)" stroke-width="6"></circle>
                <circle cx="0" cy="0" r="25.5" fill="#ffffff"></circle>
                <image href="${MASCOT_DATA_URI}" x="-26" y="-26" width="52" height="52" preserveAspectRatio="xMidYMid slice" clip-path="url(#clip-${containerId})"></image>
              </g>
            </svg>
          </div>
        `;
      }

      function buildHallwayBackdrop(config) {
        const hallY = config.height / 2 - 48;
        const hallHeight = 96;
        let ticks = "";
        for (let i = 0; i < config.cols; i += 1) {
          const x = config.marginX + i * config.cell + config.cell / 2;
          ticks += `
            <line x1="${x}" y1="${hallY + 8}" x2="${x}" y2="${hallY + hallHeight - 8}" stroke="#c8d6e5" stroke-width="2"></line>
            <text x="${x}" y="${hallY + hallHeight + 28}" text-anchor="middle" font-size="16" font-weight="700" fill="#6a8094">${i}</text>
          `;
        }

        return `
          <rect x="0" y="0" width="${config.width}" height="${config.height}" fill="#f5f9fc"></rect>
          <rect x="${config.marginX - 18}" y="${hallY}" rx="20" ry="20" width="${config.cols * config.cell + 36}" height="${hallHeight}" fill="#e8eef5" stroke="#d3dde8" stroke-width="4"></rect>
          <rect x="${config.marginX - 4}" y="${hallY + 28}" rx="18" ry="18" width="${config.cols * config.cell + 8}" height="40" fill="#dde7f0"></rect>
          <text x="${config.width / 2}" y="38" text-anchor="middle" font-size="22" font-weight="800" fill="#36556f">Main Hallway</text>
          ${ticks}
        `;
      }

      function buildSchoolBackdrop(config) {
        const roomW = config.cell * 1.5;
        const roomH = 58;
        const leftX = 18;
        const rightX = config.width - roomW - 18;
        const topY = 12;
        const topY2 = 82;
        const bottomY = config.height - roomH - 82;
        const bottomY2 = config.height - roomH - 12;

        return `
          <rect x="0" y="0" width="${config.width}" height="${config.height}" fill="#f4f9fc"></rect>

          <rect x="24" y="24" width="${config.width - 48}" height="${config.height - 48}" rx="28" fill="#edf4f8" stroke="#d8e4ee" stroke-width="4"></rect>

          <rect x="${leftX}" y="${topY}" width="${roomW}" height="${roomH}" rx="18" fill="#ffe9d6" stroke="#efc39c" stroke-width="3"></rect>
          <text x="${leftX + roomW / 2}" y="${topY + 36}" text-anchor="middle" font-size="17" font-weight="800" fill="#8d5f31">Office</text>

          <rect x="${rightX}" y="${topY}" width="${roomW}" height="${roomH}" rx="18" fill="#f2e9ff" stroke="#d6c1ff" stroke-width="3"></rect>
          <text x="${rightX + roomW / 2}" y="${topY + 36}" text-anchor="middle" font-size="17" font-weight="800" fill="#624289">Library</text>

          <rect x="${leftX}" y="${bottomY2}" width="${roomW}" height="${roomH}" rx="18" fill="#e4f7e8" stroke="#b8dfc1" stroke-width="3"></rect>
          <text x="${leftX + roomW / 2}" y="${bottomY2 + 36}" text-anchor="middle" font-size="17" font-weight="800" fill="#276241">Gym</text>

          <rect x="${rightX}" y="${bottomY2}" width="${roomW}" height="${roomH}" rx="18" fill="#fff1d8" stroke="#efdbaf" stroke-width="3"></rect>
          <text x="${rightX + roomW / 2}" y="${bottomY2 + 36}" text-anchor="middle" font-size="17" font-weight="800" fill="#87631a">Cafeteria</text>

          <rect x="${leftX}" y="${topY2}" width="${roomW}" height="${roomH}" rx="18" fill="#dff0ff" stroke="#bed7ee" stroke-width="3"></rect>
          <text x="${leftX + roomW / 2}" y="${topY2 + 36}" text-anchor="middle" font-size="17" font-weight="800" fill="#2a567c">Room 101</text>

          <rect x="${rightX}" y="${topY2}" width="${roomW}" height="${roomH}" rx="18" fill="#ffe4ee" stroke="#f0bfd2" stroke-width="3"></rect>
          <text x="${rightX + roomW / 2}" y="${topY2 + 36}" text-anchor="middle" font-size="17" font-weight="800" fill="#87425f">Room 102</text>

          <rect x="${leftX}" y="${bottomY}" width="${roomW}" height="${roomH}" rx="18" fill="#f4ecff" stroke="#d9c7f7" stroke-width="3"></rect>
          <text x="${leftX + roomW / 2}" y="${bottomY + 36}" text-anchor="middle" font-size="17" font-weight="800" fill="#624386">Lab</text>

          <rect x="${rightX}" y="${bottomY}" width="${roomW}" height="${roomH}" rx="18" fill="#e3fff9" stroke="#bde9de" stroke-width="3"></rect>
          <text x="${rightX + roomW / 2}" y="${bottomY + 36}" text-anchor="middle" font-size="17" font-weight="800" fill="#1e6c61">Room 103</text>

          <rect x="${config.marginX - 10}" y="${config.marginY - 6}" width="${config.cols * config.cell + 20}" height="${config.rows * config.cell + 12}" rx="26" fill="#ffffff" stroke="#d8e4ee" stroke-width="4"></rect>

          <g opacity="0.85">
            ${
              Array.from({ length: config.cols }, (_, x) => {
                return Array.from({ length: config.rows }, (_, y) => {
                  const pt = pointToPx(config, { x, y });
                  return `<circle cx="${pt.x}" cy="${pt.y}" r="4.5" fill="#cfdbe5"></circle>`;
                }).join("");
              }).join("")
            }
          </g>

          <text x="${config.width / 2}" y="${config.height - 22}" text-anchor="middle" font-size="18" font-weight="800" fill="#47647b">School Hallway Map</text>
        `;
      }

      function getMoveEndpoints(start, moves) {
        let current = { x: start.x, y: start.y };
        return moves.map((move, idx) => {
          current = (() => {
            if (move.dir === "right") return { x: current.x + move.units, y: current.y };
            if (move.dir === "left") return { x: current.x - move.units, y: current.y };
            if (move.dir === "up") return { x: current.x, y: current.y - move.units };
            if (move.dir === "down") return { x: current.x, y: current.y + move.units };
            return { ...current };
          })();
          return { point: { ...current }, isFinish: idx === moves.length - 1 };
        });
      }

      function buildFlagGroup(containerId, idSuffix, x, y, label, color, opacity = 1) {
        return `
          <g id="${containerId}-${idSuffix}" opacity="${opacity}">
            <line x1="${x}" y1="${y + 8}" x2="${x}" y2="${y - 56}" stroke="#5d6b78" stroke-width="4" stroke-linecap="round"></line>
            <path d="M ${x} ${y - 56} L ${x + 64} ${y - 44} L ${x} ${y - 24} Z" fill="${color}" stroke="#32485f" stroke-width="3" stroke-linejoin="round"></path>
            <text x="${x + 24}" y="${y - 38}" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">${label}</text>
          </g>
        `;
      }

      function build1DFlagMarkup(containerId, round, config) {
        const startPx = pointToPx(config, round.start);
        const endpoints = getMoveEndpoints(round.start, round.moves);
        const stopFlags = endpoints
          .filter(item => !item.isFinish)
          .map((item, idx) => {
            const pt = pointToPx(config, item.point);
            return buildFlagGroup(containerId, `flag-stop-${idx + 1}`, pt.x, pt.y, `Stop ${idx + 1}`, "#f39c12", 0);
          })
          .join("");

        return `
          ${buildFlagGroup(containerId, "flag-start", startPx.x - 12, startPx.y, "Start", "#0e784a", 1)}
          ${stopFlags}
        `;
      }

      function setFlagVisibility(containerId, idSuffix, visible) {
        const el = document.getElementById(`${containerId}-${idSuffix}`);
        if (el) el.setAttribute("opacity", visible ? "1" : "0");
      }

      function getRevealMilestones(round) {
        let total = 0;
        return round.moves
          .map((move, idx) => {
            total += move.units;
            return {
              stepIndex: total,
              idSuffix: `flag-stop-${idx + 1}`,
              isLast: idx === round.moves.length - 1
            };
          })
          .filter(item => !item.isLast)
          .map(({ stepIndex, idSuffix }) => ({ stepIndex, idSuffix }));
      }

      function getConceptMarkerPositions(round) {
        const config = get2DConfig();
        const points = buildExpandedPath(round.start, round.moves);
        const pxPoints = points.map(point => pointToPx(config, point));
        const startPx = pxPoints[0];
        const endPx = pxPoints[pxPoints.length - 1];
        const middlePathPx = pxPoints[Math.floor(pxPoints.length / 2)];
        const arrowMidPx = round.answers.displacement === 0
          ? { x: endPx.x + 38, y: endPx.y - 38 }
          : { x: (startPx.x + endPx.x) / 2, y: (startPx.y + endPx.y) / 2 };

        return {
          marker1: { x: startPx.x, y: startPx.y - 48 },
          marker2: { x: endPx.x, y: endPx.y + 48 },
          marker3: { x: middlePathPx.x + 58, y: middlePathPx.y - 10 },
          marker4: { x: arrowMidPx.x - 54, y: arrowMidPx.y + 18 }
        };
      }

      function renderConceptMarkers(containerId, round, assignments = null, mode = "play") {
        const shell = document.getElementById(`${containerId}-shell`);
        if (!shell) return;

        shell.querySelectorAll(".concept-marker").forEach(el => el.remove());

        const config = get2DConfig();
        const positions = getConceptMarkerPositions(round);
        const labels = assignments || {};

        Object.entries(positions).forEach(([key, pos], idx) => {
          const marker = document.createElement("div");
          marker.className = `concept-marker ${mode === "feedback" ? "with-label" : ""}`;
          marker.style.left = `${(pos.x / config.width) * 100}%`;
          marker.style.top = `${(pos.y / config.height) * 100}%`;

          const text = labels[key]
            ? `<div class="concept-label">${labels[key]}</div>`
            : "";

          marker.innerHTML = `<div class="concept-badge">${idx + 1}</div>${text}`;
          shell.appendChild(marker);
        });
      }

      function pointToPx(config, point) {
        return {
          x: config.marginX + point.x * config.cell + config.cell / 2,
          y: config.kind === "1d"
            ? config.height / 2
            : config.marginY + point.y * config.cell + config.cell / 2
        };
      }

      function buildExpandedPath(start, moves) {
        const points = [{ x: start.x, y: start.y }];
        let current = { x: start.x, y: start.y };

        moves.forEach(move => {
          for (let step = 0; step < move.units; step += 1) {
            current = moveOneStep(current, move.dir);
            points.push({ x: current.x, y: current.y });
          }
        });

        return points;
      }

      function moveOneStep(point, dir) {
        if (dir === "right") return { x: point.x + 1, y: point.y };
        if (dir === "left") return { x: point.x - 1, y: point.y };
        if (dir === "up") return { x: point.x, y: point.y - 1 };
        if (dir === "down") return { x: point.x, y: point.y + 1 };
        return { ...point };
      }

      async function animateRoute(containerId, round, runId, showTargets = false) {
        const config = round.mapType === "1d" ? get1DConfig(round) : get2DConfig();
        const points = buildExpandedPath(round.start, round.moves);
        const pxPoints = points.map(point => pointToPx(config, point));
        const token = document.getElementById(`${containerId}-token`);
        const path = document.getElementById(`${containerId}-path`);
        const endMarker = document.getElementById(`${containerId}-end`);
        const arrow = document.getElementById(`${containerId}-arrow`);
        const zeroBadge = document.getElementById(`${containerId}-zeroBadge`);
        const stepDelay = round.stepDelay || 1000;
        const initialDelay = round.initialDelay === 0 ? 0 : (round.initialDelay || 2000);
        const milestones = round.mapType === "1d" ? getRevealMilestones(round) : [];

        if (!token || !path) return;

        path.setAttribute("points", `${pxPoints[0].x},${pxPoints[0].y}`);
        token.setAttribute("transform", `translate(${pxPoints[0].x}, ${pxPoints[0].y})`);
        endMarker.setAttribute("opacity", "0");
        arrow.setAttribute("opacity", "0");
        zeroBadge.setAttribute("opacity", "0");

        if (round.mapType === "1d") {
          milestones.forEach(item => setFlagVisibility(containerId, item.idSuffix, false));
        }

        await sleep(initialDelay);
        if (runId !== state.animationRunId) return;

        for (let i = 1; i < pxPoints.length; i += 1) {
          if (runId !== state.animationRunId) return;

          token.setAttribute("transform", `translate(${pxPoints[i].x}, ${pxPoints[i].y})`);
          path.setAttribute("points", pxPoints.slice(0, i + 1).map(pt => `${pt.x},${pt.y}`).join(" "));

          if (round.mapType === "1d") {
            milestones.filter(item => item.stepIndex === i).forEach(item => {
              setFlagVisibility(containerId, item.idSuffix, true);
            });
          }

          await sleep(stepDelay);
        }

        const startPx = pxPoints[0];
        const endPx = pxPoints[pxPoints.length - 1];
        endMarker.setAttribute("cx", endPx.x);
        endMarker.setAttribute("cy", endPx.y);
        endMarker.setAttribute("opacity", "1");

        if (round.answers.displacement === 0) {
          zeroBadge.setAttribute("transform", `translate(${endPx.x - startPx.x}, ${endPx.y - startPx.y})`);
          zeroBadge.setAttribute("opacity", "1");
        } else {
          arrow.setAttribute("x1", startPx.x);
          arrow.setAttribute("y1", startPx.y);
          arrow.setAttribute("x2", endPx.x);
          arrow.setAttribute("y2", endPx.y);
          arrow.setAttribute("opacity", "1");
        }

        if (showTargets && round.mapType === "2d") {
          renderConceptMarkers(containerId, round);
        }
      }

      function drawStaticState(containerId, round) {
        const config = round.mapType === "1d" ? get1DConfig(round) : get2DConfig();
        const points = buildExpandedPath(round.start, round.moves).map(point => pointToPx(config, point));
        const token = document.getElementById(`${containerId}-token`);
        const path = document.getElementById(`${containerId}-path`);
        const endMarker = document.getElementById(`${containerId}-end`);
        const arrow = document.getElementById(`${containerId}-arrow`);
        const zeroBadge = document.getElementById(`${containerId}-zeroBadge`);

        if (!token || !path) return;

        const startPx = points[0];
        const endPx = points[points.length - 1];

        path.setAttribute("points", points.map(pt => `${pt.x},${pt.y}`).join(" "));
        token.setAttribute("transform", `translate(${endPx.x}, ${endPx.y})`);
        endMarker.setAttribute("cx", endPx.x);
        endMarker.setAttribute("cy", endPx.y);
        endMarker.setAttribute("opacity", "1");

        if (round.mapType === "1d") {
          getRevealMilestones(round).forEach(item => setFlagVisibility(containerId, item.idSuffix, true));
        }

        if (round.answers.displacement === 0) {
          zeroBadge.setAttribute("opacity", "1");
        } else {
          arrow.setAttribute("x1", startPx.x);
          arrow.setAttribute("y1", startPx.y);
          arrow.setAttribute("x2", endPx.x);
          arrow.setAttribute("y2", endPx.y);
          arrow.setAttribute("opacity", "1");
        }
      }
